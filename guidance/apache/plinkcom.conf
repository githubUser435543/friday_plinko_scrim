<VirtualHost *:80>
    ServerName guidance
    DocumentRoot /var/www/plinkcom/public

    <Directory /var/www/plinkcom/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/plinkcom-error.log
    CustomLog ${APACHE_LOG_DIR}/plinkcom-access.log combined

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
</VirtualHost>
